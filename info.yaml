# Tiny Tapeout project information
project:
  title:        "tt_um_hack_computer"      # Project title
  author:       "filthyfil"      # Your name
  discord:      "pyrate7c"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "a 16-bit cpu called hack"      # One line description of what your project does
  language:     "SystemVerilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     25000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_filthyfil_hack"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.sv"
    - "alu.sv"
    - "cpu.sv"
    - "memory_controller.sv"
    - "program_counter.sv"
    - "register.sv"
    - "spi_master.sv"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "KBD[0]"
  ui[1]: "KBD[1]"
  ui[2]: "KBD[2]"
  ui[3]: "KBD[3]"
  ui[4]: "KBD[4]"
  ui[5]: "KBD[5]"
  ui[6]: "KBD[6]"
  ui[7]: "KBD[7]"

  # Outputs
  uo[0]: "OUT[0]"
  uo[1]: "OUT[1]"
  uo[2]: "OUT[2]"
  uo[3]: "OUT[3]"
  uo[4]: "OUT[4]"
  uo[5]: "OUT[5]"
  uo[6]: "OUT[6]"
  uo[7]: "OUT[7]"

  # Bidirectional pins
  uio[0]: "CS0 (flash)"
  uio[1]: "MOSI"
  uio[2]: "MISO"
  uio[3]: "SCK"
  uio[4]: ""
  uio[5]: ""
  uio[6]: "CS1 (PSRAM A)"
  uio[7]: "CS2 (PSRAM B, held high)"

# Do not change!
yaml_version: 6
